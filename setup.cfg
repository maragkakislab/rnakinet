[metadata]
name = rnakinet
version = 2.0.1
description = Detect 5EU- and 4SU-labeled nanopore reads; compute RNA kinetic rates
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/maragkakislab/RNAkinet

[options]
packages = find:
python_requires = >=3.10
install_requires =
    numpy
    pandas
    scikit-learn
    tqdm
    torch>=2.0
    lightning>=2.0
    torchmetrics
    pod5
    pysam

[options.packages.find]
include = rnakinet*

[options.entry_points]
console_scripts =
    rnakinet-inference = rnakinet.scripts.inference:main
    rnakinet-predict-halflives = rnakinet.scripts.predict_halflives:main

[options.package_data]
* = *.ckpt